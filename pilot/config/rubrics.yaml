# 단계별 검증 루브릭. criteria 문구를 바꾸면 검증 기준이 즉시 바뀐다.
defaults:
  pass_threshold: 0.72
  reject_below: 0.45

R1_INTAKE:
  description: "인테이크 추출의 완결성"
  criteria:
    - { id: C1, weight: 0.25, text: "업종/직군, 대상 시스템(모듈 단위), 문제 현상, 제약조건 네 가지가 모두 확보되었는가" }
    - { id: C2, weight: 0.25, text: "문제 유형에 맞는 개입 가능한 경계(모듈·정보 경계·의사결정 관계)로 좁혀졌는가" }
    - { id: C3, weight: 0.20, text: "사용자 원문에 없는 수치나 사실을 지어내지 않았는가" }
    - { id: C4, weight: 0.20, text: "모순 후보가 'A를 높이면 B가 나빠진다' 형태로 2개 이상 도출되었는가" }
    - { id: C5, weight: 0.10, text: "제약조건의 수치와 단위가 분리되어 기입되었는가(수치 제약이 있는 경우)" }

R2_CANDIDATE:
  description: "시스템 후보 제시의 타당성"
  criteria:
    - { id: C1, weight: 0.4, text: "후보들이 서로 다른 시스템 경계 해석을 제시하는가(단순 명칭 변형이 아닌가)" }
    - { id: C2, weight: 0.3, text: "각 후보가 상위시스템-대상시스템-하위요소 계층으로 기술되었는가" }
    - { id: C3, weight: 0.3, text: "문제 영역, 작용 영역(OZ), 작용 시간(OT)이 구체적으로 정의되었는가" }

# 필수 기준은 가중 평균과 독립인 의미 게이트다. min_score 미달/누락이면 PASS 불가.
# 나머지 품질 기준은 가중 점수로 평가하여 모든 항목의 만점을 강제하지 않는다.
R3_NW:
  description: "9-Windows의 시간·계층·근거 정합성"
  criteria:
    - { id: C1, weight: 0.40, required: true, min_score: 1.0, text: "9개 시간·계층 칸이 확정 경계를 유지하며 근거 없는 상태·수치·가설을 관측 사실로 단정하지 않는가? 실제 위반의 위치·인용·근거 충돌로 이진 판정한다. 확정 경계 정의, 가능성에 대한 사용자 응답, 문장/셀에 적용되는 가설 표기는 사실 위조가 아니다. 관측된 개입 전 기준값은 사건 전후축의 PAST에 둘 수 있고 역사적 세대 이력과 구별한다" }
    - { id: C2, weight: 0.35, text: "문제 발생 전·중·후의 사건축 또는 명시한 비교조건과 세대 진화축을 구별하는가? 관측된 기준조건→변경조건 비교는 시간축 근거로 인정하되 실제 날짜·장기 이력은 창작하지 않고 미확인 과거를 표시하는가" }
    - { id: C3, weight: 0.25, text: "통찰이 실제 개입·자원 탐색에 연결되며 확인할 조건과 적용 범위를 설명하는가" }

R3_FUNC:
  description: "확정 경계에서 주기능과 기능 모델의 의미 정합성"
  criteria:
    - { id: C1, weight: 0.30, required: true, min_score: 1.0, text: "앱의 대표 BASIC 하나가 USEFUL이며 확정 경계·사용자 수정에 맞는 본래 유익 기능을 실제 수행하는가? rank를 세고 도구·대상·작용·속성과 대표 선정 근거를 대조하며 개수만으로 통과시키지 않는다. 공동목적이 여러 개면 다른 필수 유익 기능은 전체 모델의 USEFUL/AUXILIARY로 보존할 수 있다. 이 표기는 목적 삭제/중요도 격하가 아니며 모든 목적의 한 간선 합성을 강요하지 않는다. 같은 subject의 보조 간선은 BASIC이 아니며 구성요소도 수행자다. 개선 목표·유해 기능·중간 수단 승격과 하위 경계에 상위 목적 강요를 피하는가" }
    - { id: C2, weight: 0.20, text: "문제 현상을 유해 작용 또는 부족/과잉 유익 작용으로 구분하고 인과적인 수행 주체를 명확히 하는가" }
    - { id: C3, weight: 0.25, required: true, min_score: 1.0, text: "subject/object가 등록된 수행 주체/작용 대상이고 action은 완결된 구체 작용, parameter_affected는 대상의 변화·유지 속성인가? PRODUCT가 object인 것은 정상이다. 노출 정도·사용 범위·잔존 기간·전달 경로·승인 상태도 기능적 속성이며 동의어 교체만 강요하지 않는다. 속성을 object로 바꾸거나 가짜 파라미터 구성요소를 만들지 않는다. 관리한다·최적화한다 대신 실제 작용을 설명하며 권한/유인을 물리적 힘으로 치환하지 않는가? notes/evidence_status/evidence_refs와 연결된 상호작용의 가설 한정을 보존하고 kind·level과 근거 확실성을 혼동하지 않는가" }
    - { id: C4, weight: 0.10, text: "관련 상위 시스템/환경과 기능 연결을 포함하되 수량 때문에 부품을 창작하지 않는가" }
    - { id: C5, weight: 0.15, text: "처리 대상 PRODUCT와 수행 도구를 구별하며 kind·level·rank를 서로 독립적으로 분류하는가? BASIC=USEFUL의 level은 INSUFFICIENT/NORMAL/EXCESSIVE 모두 가능하며 통과 목적으로 NORMAL을 강요하지 않는다. PRODUCT가 object인 정상 방향을 뒤집지 않는가" }

R3_SUF:
  description: "현재 문제의 물질-장 역할과 완전성"
  criteria:
    - { id: C1, weight: 0.40, required: true, min_score: 1.0, text: "확인된 물리 범위에서 S1=작용 받는 실물 물질/부품, S2=작용을 전달하는 실물 도구, F=매개 작용으로 S2→F→S1을 유지하는가? 클램핑 하중·계면 전단응력·열사이클 부하·온도는 힘/상태이지 물질이 아니다. components에 그 이름이 있어도 물질성이 입증되지 않는다. 같은 물질의 S1/S2 역할은 모델별 작용 방향으로 판단하고 일괄 역전시키지 않는가? 물리 범위가 없으면 비적용이 타당한가" }
    - { id: C2, weight: 0.35, required: true, min_score: 1.0, text: "completeness는 S1/S2/F의 실제 결손, effect는 명시한 대상 속성·조건에서의 충분성/유해성으로 판정하는가? 같은 하중이 접촉 열전달을 개선하면서 계면 파손을 일으킬 수 있어 유익 효과가 다른 모델의 HARMFUL/EXCESSIVE를 배제하지 않는다. EXCESSIVE는 해당 작용의 과도성 근거가 필요하고 증가만으로 확정하지 않는다. 결손을 가짜 요소로 채우거나 해법용 S3를 현재 물질로 넣지 않는가" }
    - { id: C3, weight: 0.25, text: "모델마다 하나의 문제 작용을 표현하고 명칭·방향·조건·도식이 일치하는가" }

R3_RES:
  description: "기존 자원과 가용성 가설의 구분"
  criteria:
    - { id: C1, weight: 0.45, required: true, min_score: 1.0, text: "자원의 존재 근거와 가용 조건을 구분하고 새 설비·예산·인력을 기존 무료 자원으로 만들지 않는가? 미확인·파생 자원·수량·금지 조건을 명시하고 빈 자원 목록이면 unavailable_reason을 설명하는가" }
    - { id: C2, weight: 0.25, text: "관련 시스템·상위·환경·시간·정보 자원을 탐색하되 없는 카테고리를 억지로 채우지 않는가" }
    - { id: C3, weight: 0.30, text: "각 자원이 대체/보강할 작용과 용량·접근·전환 조건을 구체적으로 연결하는가" }

R3_CECA:
  description: "손실에서 원인까지의 근거 있는 인과사슬"
  criteria:
    - { id: C1, weight: 0.35, required: true, min_score: 1.0, text: "초기 사용자 손실과 원인 경로를 연결하고 관측·도출·경쟁 가설을 구분하는가? 관측 근거 없는 인과나 생성된 앞 단계 주장을 OBSERVED로 승격하지 않는가" }
    - { id: C2, weight: 0.30, text: "관리 부족/노후화 같은 총론이나 동의어 반복 대신 문제 유형에 맞는 작동 경로와 AND/OR 조건을 설명하는가" }
    - { id: C3, weight: 0.20, text: "원인 노드.parents=[그 원인이 유발하는 결과 ID]의 저장 방향과 ID·비순환성이 맞는가? TARGET_DISADVANTAGE.parents=[]이다. 결과 노드에 원인 ID를 역으로 넣거나 AND/OR 원인 그룹을 결과의 parents에 옮기지 않는다. 통제/지배 법칙 경계에서 멈추며 깊이를 채우기 위해 허구 원인을 만들지 않는가" }
    - { id: C4, weight: 0.15, text: "모순 씨앗의 보존할 유익 기능과 가설의 대조·반증 조건을 설명하는가" }

R3_CONSTRAINT:
  description: "발견 제약과 확인된 요구의 구분"
  criteria:
    - { id: C1, weight: 0.50, required: true, min_score: 1.0, text: "사용자 미확인 제약은 hard=false/confidence<=0.6의 가설로 두고 관행·선호·미확인 법규/수치를 절대 금지로 만들지 않는가? confirmed taboo는 실제 확인 HARD 제약 ID에 근거하는가" }
    - { id: C2, weight: 0.30, text: "최신 사용자 수정·예외·적용 범위와 확정 제약을 유지하고 물리 범위를 넘어 새 조건을 강요하지 않는가" }
    - { id: C3, weight: 0.20, text: "rationale·위반 사례·수치·단위가 해당 제약과 연결되며 중복·무관한 규칙을 늘리지 않는가" }

R4_IFR:
  description: "필요 유익 기능을 보존하는 이상해결책"
  criteria:
    - { id: C1, weight: 0.20, text: "X-요소가 미지의 기능 담당자이며 구체 부품·정책·알고리즘의 해결책을 선점하지 않는가" }
    - { id: C2, weight: 0.45, required: true, min_score: 1.0, text: "최신 확정 경계와 검증된 BASIC의 필요한 유익 기능을 실제 OZ/OT에서 유지하면서 문제 현상을 제거하는가? 기존 고압·고온·반복 승인 같은 불리한 수단을 보존 목표로 고정하지 않고 앞선 BASIC 충돌/미확인을 숨기지 않는가" }
    - { id: C3, weight: 0.35, required: true, min_score: 1.0, text: "확인된 HARD 제약을 지키고 강화 IFR을 확인 자원만의 요구로 기술하는가? 미확인/차단 자원이나 이상적 목표를 실행 가능·달성 사실로 단정하지 않는가" }

R4_CONTRA:
  description: "기술적·물리적 모순의 인과 및 요구 정합성"
  criteria:
    - { id: C1, weight: 0.25, required: true, min_score: 1.0, text: "기술적 모순이 같은 조치에서 서로 다른 성능의 개선과 악화를 일으키는 인과쌍인가? 단순 두 목표 나열·무근거 역방향·개수 채우기를 피하고 미적용을 설명하는가" }
    - { id: C2, weight: 0.20, text: "개선/악화 파라미터가 제공된 사전 정의와 대응하고 매핑 한계를 설명하는가? 같은 번호라는 이유만으로 물리적 모순으로 바꾸지 않는가" }
    - { id: C3, weight: 0.25, required: true, min_score: 1.0, text: "물리적 모순은 동일 요소·동일 속성의 상반 요구와 각각의 정당한 이유인가? 다른 요소/속성을 섞지 않으며 적용 불가이면 physical_not_applicable_reason과 빈 배열로 설명하는가" }
    - { id: C4, weight: 0.20, text: "원문·인과사슬의 실제 근거/ID/가설 상태와 연결되며 결합 메커니즘이 명확한가" }
    - { id: C5, weight: 0.10, text: "확인 제약이 만드는 실제 모순을 다루되 사용자가 요구하지 않은 성능·금지를 만들지 않는가" }

R4_TRIM:
  description: "요소 제거 후 유익 기능 보존"
  criteria:
    - { id: C1, weight: 0.45, required: true, min_score: 1.0, text: "실제 요소/공정을 제거하면서 모든 필요한 유익 기능의 이전·자기수행 또는 필요 소멸을 설명하고 BASIC 및 사용자 필수 요구·품질·책임을 보존하는가? 단순 신설/교체를 트리밍으로 포장하지 않는가" }
    - { id: C2, weight: 0.35, text: "대체 수행자의 존재·상호작용·가용 자원·용량·시간·책임 조건과 위험을 설명하며 미확인을 가설로 두는가" }
    - { id: C3, weight: 0.20, text: "대상·기능·대체자 참조와 앱 A/B/C/D 분류가 맞으며 타당한 후보가 없을 때 강제로 생성하지 않는가" }

R4_KEY:
  description: "근거 있는 핵심 문제 선택"
  criteria:
    - { id: C1, weight: 0.45, required: true, min_score: 1.0, text: "선택 문제는 실제 입력 모순 ID와 초기 손실에 연결되며 확정 경계·사용자 성과를 유지하는가? 새 ID/범위를 만들거나 동일 ID를 선택과 제외에 중복하지 않는가" }
    - { id: C2, weight: 0.35, text: "impact/tractability가 근거·자원·제약·불확실성에 비례하고 동일 TC/PC 표현을 중복 문제로 부풀리지 않는가" }
    - { id: C3, weight: 0.20, text: "미선정 모순에 제외/보류 이유를 남기고 다양성이나 개수를 채우기 위해 문제를 발명하지 않는가" }

R5_A:
  description: "발명원리 적용의 구체성"
  criteria:
    - { id: C1, weight: 0.35, text: "아이디어가 일반론이 아니라 대상 시스템의 구체적 요소/규칙/공정/변수 수준으로 서술되었는가" }
    - { id: C2, weight: 0.25, text: "제시된 원리 목록 밖의 원리를 임의로 쓰지 않았는가" }
    - { id: C3, weight: 0.20, text: "가용 자원을 실제로 활용하는가" }
    - { id: C4, weight: 0.20, text: "악화 파라미터를 다시 유발하지 않는지 자체 반박이 이루어졌는가" }

R5_B:
  description: "물리적 모순의 7개 해결 접근 검토"
  criteria:
    - { id: C1, weight: 0.40, text: "공간/시간/관계(조건)/방향/시스템 수준 분리, 동시 충족, 우회의 7개 접근을 모두 검토했으며 미적용 근거가 있는가? 시스템 수준은 질문으로 제외하지 않고 적용안 개수로 성공을 강제하지 않는가?" }
    - { id: C2, weight: 0.35, text: "분리의 실제 축·범위, 동시 충족의 인과 메커니즘, 우회의 기능 실현 변경을 구별하는가? 온도 변화만으로 관계 분리를 단정하거나 동일 대상·속성·조건의 A/not-A 동시 성립을 설명 없이 주장하지 않는가?" }
    - { id: C3, weight: 0.25, text: "원래 필요한 요구·기능과 승인된 필수 제약을 유지하는가? 단순 절충, 타인·다른 시점·시스템으로 손실 전가, 요구나 제약 삭제를 우회 해결로 포장하지 않는가? 권장 원리와 실제 사용 원리를 구분하며 권장 밖 선택·미확인 원리의 근거 공백을 밝히는가?" }

R5_C:
  description: "표준해 적용의 정확성"
  criteria:
    - { id: C1, weight: 0.40, text: "제시된 후보 표준해 코드만 사용했는가(코드 창작 금지)" }
    - { id: C2, weight: 0.30, text: "모델 변환(transformation)이 표준해의 정의와 일치하는가" }
    - { id: C3, weight: 0.30, text: "변환 결과를 실제 물질/장으로 치환한 아이디어가 구체적인가" }

R5_D:
  description: "ARIZ 실행의 절차 충실도"
  criteria:
    - { id: C1, weight: 0.30, text: "각 스텝이 요구한 형식(미니문제/갈등쌍/OZ/OT/IFR/물리모순)을 채웠는가" }
    - { id: C2, weight: 0.35, text: "거시 모순이 미시 수준 모순으로 실제로 번역되었는가" }
    - { id: C3, weight: 0.35, text: "IFR-2가 '기존 자원이 스스로' 형태로 진술되었는가" }

R5_MERGE:
  description: "아이디어 통합 품질"
  criteria:
    - { id: C1, weight: 0.35, text: "본질이 같은 아이디어가 중복으로 남아 있지 않은가" }
    - { id: C2, weight: 0.35, text: "각 아이디어의 개입 변수·작동 조건·양쪽 요구 보존 경로가 대상 모순에 연결되는가" }
    - { id: C3, weight: 0.30, text: "메커니즘이 다양하며 핵심 모순의 미해결·단일 가설 의존성을 정직하게 드러내는가" }

R6_CONCEPT:
  description: "해결 개념의 실행 가능성"
  criteria:
    - { id: C1, weight: 0.25, text: "무엇을 어떻게 바꾸는지가 변수별로 명확하고, 제목·한 줄 요약·상세 설명·변경 목록·검증 계획의 증가/감소/유지/조건부 방향, 수치·단위·부등호가 일치하는가? 방향이 다른 변수들을 하나의 동사로 묶지 않았는가" }
    - { id: C2, weight: 0.20, text: "조작 변수의 직접 효과에서 최종 성능까지 인과 경로가 성립하고 모순 양측의 성립 경로와 실패 조건이 있는가? 관련되지만 다른 물리량을 혼동하거나 조건에 따라 달라지는 방향을 무조건 일반화하지 않았는가" }
    - { id: C3, weight: 0.20, text: "기대효과의 가정·근거가 명시되고 목표·예측·측정 결과를 구분하는가? 짧은 요약에서도 미검증 목표를 달성 사실로 단정하거나 무근거 수치를 추가하지 않았는가" }
    - { id: C4, weight: 0.20, text: "제약조건을 설계 입력으로 반영했는가" }
    - { id: C5, weight: 0.15, text: "전제 가정과 잠재 위험, 기준 상태·대조 관측·반증 기준을 포함한 검증 계획이 있는가" }

R8_REVIEW:
  description: "평가의 변별력과 근거"
  criteria:
    - { id: C1, weight: 0.45, text: "모든 개념을 동일한 기준으로 평가하고 점수 차이를 근거 없이 강제하지 않았는가" }
    - { id: C2, weight: 0.35, text: "근거가 해당 직무 관점에서 구체적인가(무근거 호평이 아닌가)" }
    - { id: C3, weight: 0.20, text: "제약 위반 의심 시 red_flags에 명시했는가" }
