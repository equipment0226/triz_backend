# 단계별 검증 루브릭. criteria 문구를 바꾸면 검증 기준이 즉시 바뀐다.
defaults:
  pass_threshold: 0.72
  reject_below: 0.45

R1_INTAKE:
  description: "인테이크 추출의 완결성"
  criteria:
    - { id: C1, weight: 0.25, text: "업종/직군, 대상 시스템(모듈 단위), 문제 현상, 제약조건 네 가지가 모두 확보되었는가" }
    - { id: C2, weight: 0.25, text: "문제 유형에 맞는 개입 가능한 경계(모듈·정보 경계·의사결정 관계)로 좁혀졌는가" }
    - { id: C3, weight: 0.20, text: "사용자 원문에 없는 수치나 사실을 지어내지 않았는가" }
    - { id: C4, weight: 0.20, text: "모순 후보가 'A를 높이면 B가 나빠진다' 형태로 2개 이상 도출되었는가" }
    - { id: C5, weight: 0.10, text: "제약조건의 수치와 단위가 분리되어 기입되었는가(수치 제약이 있는 경우)" }

R2_CANDIDATE:
  description: "시스템 후보 제시의 타당성"
  criteria:
    - { id: C1, weight: 0.4, text: "후보들이 서로 다른 시스템 경계 해석을 제시하는가(단순 명칭 변형이 아닌가)" }
    - { id: C2, weight: 0.3, text: "각 후보가 상위시스템-대상시스템-하위요소 계층으로 기술되었는가" }
    - { id: C3, weight: 0.3, text: "문제 영역, 작용 영역(OZ), 작용 시간(OT)이 구체적으로 정의되었는가" }

R3_FUNC:
  description: "기능 모델의 TRIZ 문법 적합성"
  criteria:
    - { id: C1, weight: 0.25, text: "주기능(BASIC)이 정확히 하나 지정되고 시스템의 존재 이유를 나타내는가" }
    - { id: C2, weight: 0.25, text: "유해 기능이 1개 이상 있고, 각 유해 기능의 '수행 주체'가 명확한가" }
    - { id: C3, weight: 0.25, text: "기능이 구체적 작동 경로를 설명하고 문제 유형을 보존하는가(권한·유인을 물리 힘으로 치환하지 않는가)" }
    - { id: C4, weight: 0.15, text: "상위 시스템/환경 요소가 컴포넌트에 포함되었는가" }
    - { id: C5, weight: 0.10, text: "가공 대상(PRODUCT)이 식별되었는가" }

R3_SUF:
  description: "물질-장 모델의 정합성"
  criteria:
    - { id: C1, weight: 0.35, text: "S1(작용 받는 물질), S2(작용 가하는 물질), F(장)가 서로 혼동 없이 배정되었는가" }
    - { id: C2, weight: 0.35, text: "completeness와 effect 판정이 모델 내용과 일치하는가" }
    - { id: C3, weight: 0.30, text: "하나의 모델에 하나의 작용만 담겼는가(여러 작용을 뭉뚱그리지 않았는가)" }

R3_RES:
  description: "자원 분석의 실용성"
  criteria:
    - { id: C1, weight: 0.35, text: "'이미 존재하거나 거의 공짜인 것'만 자원으로 올렸는가(예산/인력 추가는 자원이 아니다)" }
    - { id: C2, weight: 0.35, text: "시스템 내부뿐 아니라 상위시스템/환경/폐기물/파생 자원이 포함되었는가" }
    - { id: C3, weight: 0.30, text: "각 자원이 어떤 기능을 대체·보강할 수 있는지 구체적으로 적혔는가" }

R3_CECA:
  description: "인과사슬의 논리성"
  criteria:
    - { id: C1, weight: 0.30, text: "최상단이 사업/사용자 관점 손실이고, 아래로 갈수록 문제 유형에 맞는 작동 메커니즘으로 내려가며 관측과 경쟁 가설이 구분되는가" }
    - { id: C2, weight: 0.30, text: "'관리 부족', '노후화' 같은 총론적 원인 대신 작동 메커니즘으로 서술되었는가" }
    - { id: C3, weight: 0.20, text: "근본 원인(ROOT_CAUSE)이 1개 이상 지정되고 사슬 깊이가 3단 이상인가" }
    - { id: C4, weight: 0.20, text: "모순 씨앗(제거하면 유익 기능이 손상되는 지점)이 표시되었는가" }

R4_IFR:
  description: "이상해결책의 형식과 제약 정합"
  criteria:
    - { id: C1, weight: 0.35, text: "X-요소가 '구체 부품'이 아니라 미지의 기능 담당자로 정의되었는가(해결책 선점 금지)" }
    - { id: C2, weight: 0.30, text: "작용 시간/작용 영역/유지할 유익기능/제거할 유해현상이 모두 진술에 포함되었는가" }
    - { id: C3, weight: 0.35, text: "제약조건을 위반하지 않는가(위반 시 즉시 REJECT)" }

R4_CONTRA:
  description: "모순 정의의 TRIZ 문법 적합성"
  criteria:
    - { id: C1, weight: 0.20, text: "기술적 모순이 '개선하면 ~ 악화된다'의 인과쌍으로 서술되었는가" }
    - { id: C2, weight: 0.25, text: "개선/악화 파라미터가 제시된 파라미터 정의문의 의미와 정확히 대응하는가(명칭 유사성만으로 고르지 않았는가)" }
    - { id: C3, weight: 0.25, text: "물리적 모순을 제시했다면 동일 요소·동일 속성의 상반 요구인가; 적용 불가라면 그 이유가 타당한가" }
    - { id: C4, weight: 0.20, text: "모순이 원문 문제/인과사슬에서 실제로 도출 가능한가(논리 비약이 없는가)" }
    - { id: C5, weight: 0.10, text: "제약조건이 만드는 모순이 누락되지 않았는가" }

R5_A:
  description: "발명원리 적용의 구체성"
  criteria:
    - { id: C1, weight: 0.35, text: "아이디어가 일반론이 아니라 대상 시스템의 구체적 요소/규칙/공정/변수 수준으로 서술되었는가" }
    - { id: C2, weight: 0.25, text: "제시된 원리 목록 밖의 원리를 임의로 쓰지 않았는가" }
    - { id: C3, weight: 0.20, text: "가용 자원을 실제로 활용하는가" }
    - { id: C4, weight: 0.20, text: "악화 파라미터를 다시 유발하지 않는지 자체 반박이 이루어졌는가" }

R5_B:
  description: "분리 원리 적용의 완결성"
  criteria:
    - { id: C1, weight: 0.40, text: "시간/공간/조건/시스템수준 4가지를 모두 검토했는가(미적용은 물리적 사유가 있는가)" }
    - { id: C2, weight: 0.35, text: "분리 축(무엇을 기준으로 나누는가)이 명확한가" }
    - { id: C3, weight: 0.25, text: "아이디어가 물리적 모순을 실제로 해소하는가(절충이 아닌가)" }

R5_C:
  description: "표준해 적용의 정확성"
  criteria:
    - { id: C1, weight: 0.40, text: "제시된 후보 표준해 코드만 사용했는가(코드 창작 금지)" }
    - { id: C2, weight: 0.30, text: "모델 변환(transformation)이 표준해의 정의와 일치하는가" }
    - { id: C3, weight: 0.30, text: "변환 결과를 실제 물질/장으로 치환한 아이디어가 구체적인가" }

R5_D:
  description: "ARIZ 실행의 절차 충실도"
  criteria:
    - { id: C1, weight: 0.30, text: "각 스텝이 요구한 형식(미니문제/갈등쌍/OZ/OT/IFR/물리모순)을 채웠는가" }
    - { id: C2, weight: 0.35, text: "거시 모순이 미시 수준 모순으로 실제로 번역되었는가" }
    - { id: C3, weight: 0.35, text: "IFR-2가 '기존 자원이 스스로' 형태로 진술되었는가" }

R5_MERGE:
  description: "아이디어 통합 품질"
  criteria:
    - { id: C1, weight: 0.35, text: "본질이 같은 아이디어가 중복으로 남아 있지 않은가" }
    - { id: C2, weight: 0.35, text: "각 아이디어의 개입 변수·작동 조건·양쪽 요구 보존 경로가 대상 모순에 연결되는가" }
    - { id: C3, weight: 0.30, text: "메커니즘이 다양하며 핵심 모순의 미해결·단일 가설 의존성을 정직하게 드러내는가" }

R6_CONCEPT:
  description: "해결 개념의 실행 가능성"
  criteria:
    - { id: C1, weight: 0.25, text: "무엇을 어떻게 바꾸는지가 요소/규칙/공정/변수 수준으로 서술되었는가" }
    - { id: C2, weight: 0.20, text: "모순이 해소되는 메커니즘이 문제 유형의 인과관계로 설명되며 양쪽 요구의 성립 경로와 실패 조건이 있는가" }
    - { id: C3, weight: 0.20, text: "기대효과에 가정이 명시되었는가(무근거 수치가 아닌가)" }
    - { id: C4, weight: 0.20, text: "제약조건을 설계 입력으로 반영했는가" }
    - { id: C5, weight: 0.15, text: "전제 가정과 잠재 위험, 기준 상태·대조 관측·반증 기준을 포함한 검증 계획이 있는가" }

R8_REVIEW:
  description: "평가의 변별력과 근거"
  criteria:
    - { id: C1, weight: 0.45, text: "모든 개념을 동일한 기준으로 평가하고 점수 차이를 근거 없이 강제하지 않았는가" }
    - { id: C2, weight: 0.35, text: "근거가 해당 직무 관점에서 구체적인가(무근거 호평이 아닌가)" }
    - { id: C3, weight: 0.20, text: "제약 위반 의심 시 red_flags에 명시했는가" }
